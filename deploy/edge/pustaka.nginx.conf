# Install on clino as an included file inside nginx's http {} context.
# It assumes WireGuard peers: clino=10.10.0.1, rnd=10.10.0.2.
map $host $pustaka_backend {
    hostnames;
    pustaka.mfardiansyah.id         "10.10.0.2:18401";
    dev.pustaka.mfardiansyah.id     "10.10.0.2:19401";
    default                         "";
}

server {
    listen 80;
    listen [::]:80;
    server_name pustaka.mfardiansyah.id dev.pustaka.mfardiansyah.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pustaka.mfardiansyah.id;

    ssl_certificate     /etc/letsencrypt/live/pustaka/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pustaka/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    if ($pustaka_backend = "") { return 444; }

    location / {
        # Plain HTTP is intentional: WireGuard encrypts the rnd hop.
        proxy_pass http://$pustaka_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.pustaka.mfardiansyah.id;

    ssl_certificate     /etc/letsencrypt/live/pustaka-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pustaka-dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    if ($pustaka_backend = "") { return 444; }

    location / {
        # Plain HTTP is intentional: WireGuard encrypts the rnd hop.
        proxy_pass http://$pustaka_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
