# Temporary HTTP-only configuration for the first HTTP-01 issuance. Replace it
# with pustaka.nginx.conf after Certbot has created the independent pustaka and
# pustaka-dev lineages.
server {
    listen 80;
    listen [::]:80;
    server_name pustaka.mfardiansyah.id dev.pustaka.mfardiansyah.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / { return 301 https://$host$request_uri; }
}
